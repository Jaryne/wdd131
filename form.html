<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals | Jaryne Moraleda Manrique | Product Review Form Assignment.">
    <meta name="author" content="Jaryne Manrique">
    <title>Product Review Form</title>

    <meta property="og:title" content="Assignment 05 - Form">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jaryne.github.io/wdd131/form.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
    <header><h1>Product Review</h1></header>
    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Review Form</legend>
                <label for="product">Product Name</label>
                <div class="select-wrapper">
                    <select id="product" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                    <span class="select-arrow">&#9662;</span>
                </div>

                <label>Overall Rating</label>
                <div class="star-rating">
                    <input type="radio" name="rating" id="star-a" value="5" required>
                    <label for="star-a">5 stars</label>

                    <input type="radio" name="rating" id="star-b" value="4" required>
                    <label for="star-b">4 stars</label>

                    <input type="radio" name="rating" id="star-c" value="3" required>
                    <label for="star-c">3 stars</label>

                    <input type="radio" name="rating" id="star-d" value="2" required>
                    <label for="star-d">2 stars</label>

                    <input type="radio" name="rating" id="star-e" value="1" required>
                    <label for="star-e">1 star</label>
                </div>


                <label for="installation">Date of Installation</label>
                <input type="date" id="installation" name="installation" required>

                <label>Useful Features</label>
                <div class="features">
                    <label for="feature1"><input type="checkbox" id="feature1" name="features" value="durability">Durability</label>
                    <label for="feature2"><input type="checkbox" id="feature2" name="features" value="ease-of-use">Ease of Use</label>
                    <label for="feature3"><input type="checkbox" id="feature3" name="features" value="performance">Performance</label>
                    <label for="feature4"><input type="checkbox" id="feature4" name="features" value="design">Design</label>
                </div>

                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="6" placeholder="Write a review here"></textarea>
                <label for="username">User Name</label>
                <input type="text" id="username" name="username" autocomplete="name">

                <input type="submit" value="Send Review">

            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Jaryne Manrique | The Republic of the Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
